<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Delivery</title>

<style>
body{
    margin:0;
    background:#f2f2f2;
    font-family:Arial,sans-serif;
    text-align:center;
}

.header{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:30px;
    gap:15px;
}

.search-box{
    width:70%;
    max-width:500px;
    background:#e6e6e6;
    border-radius:10px;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.search-box input{
    border:none;
    background:transparent;
    font-size:20px;
    width:100%;
    outline:none;
}

.cart{
    font-size:50px;
    color:orange;
}

.shop{
    margin-top:80px;
}

.shop img{
    width:250px;
}

.cash{
    margin-top:30px;
    font-size:60px;
    font-weight:bold;
    color:#0a1f5c;
    text-shadow:
        4px 4px 0 orange,
       -4px -4px 0 yellow,
        4px -4px 0 yellow,
       -4px 4px 0 yellow;
}

.delivery{
    font-size:70px;
    font-weight:bold;
    color:orange;
    text-shadow:
        4px 4px 0 #0a1f5c,
       -4px -4px 0 #0a1f5c,
        4px -4px 0 #0a1f5c,
       -4px 4px 0 #0a1f5c;
}
</style>
</head>

<body>

<div class="header">
    <div class="search-box">
        <input type="text" placeholder="Search">
        🔍
    </div>
    <div class="cart">🛒</div>
</div>

<div class="shop">
    <img src="https://cdn-icons-png.flaticon.com/512/5787/5787016.png" alt="Cafe">
</div>

<div class="cash">CASH</div>
<div style="font-size:40px;font-weight:bold;color:#0a1f5c;">on</div>
<div class="delivery">DELIVERY</div>

</body>
</html>
