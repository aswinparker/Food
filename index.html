<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#1ec7be;
}

.header{
    display:flex;
    align-items:center;
    padding:20px;
    color:white;
}

.logo{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#0a2b40;
}

.title{
    font-size:38px;
    font-weight:bold;
    margin-left:15px;
}

.notice{
    margin:15px;
    padding:15px;
    border:2px solid rgba(255,255,255,.5);
    border-radius:30px;
    color:white;
    overflow:hidden;
}

.banner{
    margin:15px;
}

.banner img{
    width:100%;
    border-radius:20px;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    padding:15px;
}

.card{
    background:rgba(255,255,255,.15);
    border-radius:20px;
    padding:20px;
    text-align:center;
    color:white;
    backdrop-filter:blur(5px);
}

.card img{
    width:60px;
    margin-bottom:10px;
}

.card h3{
    font-size:18px;
}

.app-banner{
    margin:15px;
    background:linear-gradient(90deg,#1a6fff,#67d9ff);
    border-radius:20px;
    padding:25px;
    text-align:center;
    color:white;
    font-size:32px;
}

.activities{
    margin:15px;
    background:white;
    border-radius:20px;
    min-height:150px;
    padding:20px;
}

.activities h2{
    color:black;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#19bdb4;
    display:flex;
    justify-content:space-around;
    padding:15px 0;
    color:white;
}

.bottom-nav div{
    text-align:center;
}
</style>
</head>
<body>

<div class="header">
    <div class="logo"></div>
    <div class="title">ETH</div>
</div>

<div class="notice">
    Mining address: https://example.com
</div>

<div class="banner">
    <img src="https://images.unsplash.com/photo-1639762681057-408e52192e55?w=1200" alt="">
</div>

<div class="menu-grid">

    <div class="card">
        <h3>Recharge</h3>
    </div>

    <div class="card">
        <h3>Withdraw</h3>
    </div>

    <div class="card">
        <h3>Company Profile</h3>
    </div>

    <div class="card">
        <h3>Invite Friends</h3>
    </div>

    <div class="card">
        <h3>Agency</h3>
    </div>

    <div class="card">
        <h3>Support</h3>
    </div>

</div>

<div class="app-banner">
    APP
</div>

<div class="activities">
    <h2>Activities</h2>
</div>

<div class="bottom-nav">
    <div>🏠<br>Home</div>
    <div>📊<br>Project</div>
    <div>👥<br>Team</div>
    <div>👤<br>Me</div>
</div>

</body>
</html>
